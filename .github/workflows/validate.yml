name: validate
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Rapid pushes to the same PR supersede each other; only the newest matters.
concurrency:
  group: validate-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q
      # Full build must not crash (hard requirement), but pre-existing bad
      # bundles on main must not fail someone else's PR — so the build runs
      # non-strict, and strict validation applies only to bundles this PR
      # touches (changed-file list from the API; no full-history clone).
      - run: python3 build.py
      - name: Validate bundles changed by this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename' \
            | grep '^bundles/.*\.json$' || true)
          if [ -n "$changed" ]; then
            # shellcheck disable=SC2086
            python3 build.py --check $changed
          else
            echo "no bundle changes"
          fi
